name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    name: CPU tests / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    env:
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU PyTorch and build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install build twine "pytest>=8,<10" "ruff==0.17.4"
      - name: Build and check distributions
        run: |
          python -m build
          python -m twine check --strict dist/*
      - name: Install the wheel
        run: python -m pip install dist/*.whl
      - name: Check installed import outside checkout
        working-directory: ${{ runner.temp }}
        run: python -c "from importlib.metadata import version; from lionplus8bit import LionPlus8bit; assert version('lionplus8bit') == '0.1.0'; assert LionPlus8bit.__module__.startswith('lionplus8bit.')"
      - name: Lint and format
        run: |
          ruff check .
          ruff format --check .
      - name: Run CPU tests against installed wheel
        run: python -m pytest -m 'not cuda' --junitxml=cpu-results.xml
      - name: Run example
        run: python examples/train_regression.py --device cpu
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: cpu-results-py${{ matrix.python }}
          path: cpu-results.xml
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7.0.2
        if: matrix.python == '3.12'
        with:
          name: distributions
          path: dist/*
