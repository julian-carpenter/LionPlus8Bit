[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lionplus8bit"
version = "0.1.0"
description = "Lion+ with global or AdaGC clipping and native bitsandbytes 8-bit optimizer state"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Julian Schäfer-Zimmermann"}]
dependencies = ["torch>=2.5,<3", "bitsandbytes==0.50.2", "packaging>=24"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1.2", "twine>=6", "ruff==0.17.4"]

[project.urls]
Homepage = "https://github.com/julian-carpenter/LionPlus8Bit"
Repository = "https://github.com/julian-carpenter/LionPlus8Bit"
Issues = "https://github.com/julian-carpenter/LionPlus8Bit/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lionplus8bit = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["cuda: requires CUDA", "multigpu: requires multiple GPUs", "paging: native paging capability", "compile: compilation integration", "fp8: FP8 integration", "slow: extended integration"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
